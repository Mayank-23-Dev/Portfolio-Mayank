<body>
  <div id="initial-loader" aria-hidden="true" title="Double-click or double-tap to skip">
    <div id="initial-loader-shell">
      <div id="initial-loader-stage">Mayank Dev</div>
      <div class="loader-skip-hint">Double click or tap to skip</div>
    </div>
  </div>

  <script>
    (function () {
      var loader = document.getElementById('initial-loader');
      if (!loader) return;
      var lastTap = 0;
      function skipLoader() {
        if (typeof window.__skipInitialLoader === 'function') {
          window.__skipInitialLoader();
        } else {
          try { sessionStorage.setItem('mayank-dev-portfolio:initial-loader-seen', 'true'); } catch (e) {}
          document.documentElement.classList.add('app-ready');
          setTimeout(function () {
            document.documentElement.classList.add('loader-hidden');
          }, 1100);
        }
      }
      loader.addEventListener('dblclick', function (e) {
        e.preventDefault();
        skipLoader();
      });
      loader.addEventListener('touchend', function (e) {
        var now = Date.now();
        if (now - lastTap < 350) {
          e.preventDefault();
          skipLoader();
        }
        lastTap = now;
      }, { passive: false });
    })();
  </script>

  <div id="root"></div>

  <style>
    #initial-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      overflow: hidden;
      transform: translate3d(0, 0, 0);
      will-change: transform;
      transition:
        transform 1100ms cubic-bezier(0.22, 1, 0.36, 1),
        visibility 0s 1100ms;
    }

    #initial-loader::after {
      content: '';
      position: absolute;
      left: -8%;
      width: 116%;
      bottom: -16vh;
      height: 24vh;
      background: #ffffff;
      border-bottom-left-radius: 48% 100%;
      border-bottom-right-radius: 48% 100%;
      transform: translateY(0);
      transition: transform 1100ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    #initial-loader-shell {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: min(92vw, 760px);
      padding: 2rem 1rem;
      text-align: center;
      animation: loaderEnter 0.5s ease-out;
      transition:
        transform 700ms cubic-bezier(0.22, 1, 0.36, 1),
        opacity 360ms ease-out;
      will-change: transform, opacity;
    }

    #initial-loader-stage {
      min-height: clamp(4rem, 16vw, 8rem);
      width: min(100%, 680px);
      color: #111827;
      font-family: 'Kalam', cursive;
      font-size: clamp(2.5rem, 8.4vw, 5.75rem);
      font-weight: 400;
      line-height: 1.05;
      letter-spacing: 0.015em;
      display: flex;
      align-items: center;
      justify-content: center;
      text-wrap: balance;
    }

    .loader-skip-hint {
      margin-top: 1.25rem;
      font-family: 'Sora', sans-serif;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(17, 24, 39, 0.4);
      user-select: none;
      pointer-events: none;
      opacity: 0;
      animation: fadeInHint 0.8s ease-out 0.6s forwards;
    }

    @keyframes fadeInHint {
      from {
        opacity: 0;
        transform: translateY(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes loaderEnter {
      from {
        opacity: 0;
        transform: translateY(16px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    html:not(.app-ready) #initial-loader {
      opacity: 1;
      pointer-events: auto;
      visibility: visible;
    }

    html.app-ready #initial-loader {
      transform: translate3d(0, calc(-100% - 18vh), 0);
      pointer-events: none;
      visibility: hidden;
    }

    html.app-ready #initial-loader::after {
      transform: translateY(-2vh);
    }

    html.app-ready #initial-loader-shell {
      opacity: 0;
      transform: translateY(-1.5rem);
    }

    html.app-ready.loader-hidden #initial-loader {
      display: none !important;
    }

    .app-ready .highlight-seq {
      animation: highlight 1200ms ease-out forwards;
    }

    @media (prefers-reduced-motion: reduce) {
      #initial-loader * {
        animation: none !important;
      }

      .app-ready .highlight-seq {
        animation: none;
      }
    }
  </style>
